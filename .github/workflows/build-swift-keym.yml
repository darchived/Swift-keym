name: Build Swift KeyM Alpha v1.0.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Package Swift-KeyM-Alpha-v1.0.0.apk & Swift-KeyM-source.zip
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Swift-KeyM-Alpha-v1.0.0.apk
          zip -r dist/Swift-KeyM-source.zip . \
            -x ".git/*" ".gradle/*" "*/build/*" "build/*" ".build-outputs/*" "dist/*" "debug.keystore"

      - name: Upload APK and Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Swift-KeyM-Alpha-v1.0.0
          path: dist/
