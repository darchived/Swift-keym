name: Build Swift KeyM Alpha v1.0.0

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.3.1 & accept Android SDK licenses
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Prepare debug keystore
        run: |
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ] && base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null && [ -s debug.keystore ]; then
            echo "Restored debug.keystore"
          else
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package Swift-KeyM-Alpha-v1.0.0.apk & Swift-KeyM-source.zip
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Swift-KeyM-Alpha-v1.0.0.apk
          zip -r dist/Swift-KeyM-source.zip . \
            -x ".git/*" ".gradle/*" "*/build/*" "build/*" ".build-outputs/*" "dist/*" "public/*" "debug.keystore"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swift-KeyM-Alpha-v1.0.0.apk
          path: dist/Swift-KeyM-Alpha-v1.0.0.apk

      - name: Upload Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swift-KeyM-source.zip
          path: dist/Swift-KeyM-source.zip

      - name: Publish to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-alpha >/dev/null 2>&1; then
            gh release upload v1.0.0-alpha dist/Swift-KeyM-Alpha-v1.0.0.apk dist/Swift-KeyM-source.zip --clobber
          else
            gh release create v1.0.0-alpha dist/Swift-KeyM-Alpha-v1.0.0.apk dist/Swift-KeyM-source.zip \
              --title "Swift KeyM Alpha v1.0.0" \
              --notes "Automated build of Swift KeyM Alpha v1.0.0 APK and source archive."
          fi
