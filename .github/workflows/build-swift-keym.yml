name: Build Swift KeyM Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_VERSION=$(echo "$VERSION_NAME" | sed -E 's/-.*//')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected versionName=$VERSION_NAME (base=$BASE_VERSION)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.3.1 & accept Android SDK licenses
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          sudo mkdir -p "$SDK_DIR/licenses" || mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" | (sudo tee "$SDK_DIR/licenses/android-sdk-license" >/dev/null || tee "$SDK_DIR/licenses/android-sdk-license" >/dev/null)
          (yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1) || true

      - name: Prepare Release Keystore (Non-Debug Signing)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="/tmp/swiftkeym-upload-key.jks"
          rm -f "$KEYSTORE_FILE"
          if [ -n "$SECRET_KEYSTORE_B64" ] && echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null && [ -s "$KEYSTORE_FILE" ]; then
            STORE_PW="$SECRET_STORE_PW"
            KEY_PW="$SECRET_KEY_PW"
            echo "Loaded persistent release keystore from repository secrets."
          else
            STORE_PW="SwiftKeyM_Release_2026"
            KEY_PW="SwiftKeyM_Release_2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PW" \
              -alias upload \
              -keypass "$KEY_PW" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Team StarDevs,OU=Swift KeyM,O=StarDevs,C=US"
            echo "Generated non-debug RSA-2048 release keystore."
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Package v${{ steps.version.outputs.version_name }}.apk & source-beta-testing-v${{ steps.version.outputs.base_version }}.zip
        run: |
          mkdir -p dist
          APK_NAME="v${{ steps.version.outputs.version_name }}.apk"
          ZIP_NAME="source-beta-testing-v${{ steps.version.outputs.base_version }}.zip"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          zip -r "dist/$ZIP_NAME" . \
            -x ".git/*" ".gradle/*" "*/build/*" "build/*" ".build-outputs/*" "dist/*" "public/*" "debug.keystore" "*.jks"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v${{ steps.version.outputs.version_name }}.apk
          path: dist/v${{ steps.version.outputs.version_name }}.apk

      - name: Upload Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-beta-testing-v${{ steps.version.outputs.base_version }}.zip
          path: dist/source-beta-testing-v${{ steps.version.outputs.base_version }}.zip

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          APK_PATH="dist/v${{ steps.version.outputs.version_name }}.apk"
          ZIP_PATH="dist/source-beta-testing-v${{ steps.version.outputs.base_version }}.zip"
          NOTES="Swift KeyM ${TAG} (Signed non-debug Release APK for Android + source archive). Note: Android installs .apk packages; if Android 13+ locks Overlay with 'Restricted setting', open App Info -> 3-dots -> Allow restricted settings, or use Shizuku auto-unlock inside Swift KeyM."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" "$ZIP_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" "$ZIP_PATH" \
              --title "Swift KeyM ${TAG}" \
              --notes "$NOTES"
          fi
